name: senapath
description: "Aplikasi pendamping latihan dan balapan sepeda."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cryptography: ^2.9.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  sensors_plus: ^7.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
